name: test

# LookLab only: firmware tests need the official firmware file, never in the repo.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  looklab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci
        working-directory: webapp
      - run: npm test
        working-directory: webapp
      - run: npm run build
        working-directory: webapp
