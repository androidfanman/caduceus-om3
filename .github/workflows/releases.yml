# Publishes every folder in releases/ as a GitHub release (tag + notes + files), once.
# A folder may hold COMMIT (a commit SHA) to tag an earlier commit; otherwise the release tags this push.
name: Releases
on:
  push:
    branches: [main]
    paths: ['releases/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create missing releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for d in releases/v*/; do
            v=$(basename "$d")
            if gh release view "$v" >/dev/null 2>&1; then echo "$v exists"; continue; fi
            target=$(cat "$d/COMMIT" 2>/dev/null || echo "$GITHUB_SHA")
            files=$(ls "$d"patch.json "$d"GUIDES.BIN "$d"LABELS.BIN "$d"TONES.BIN "$d"LOOKS.BIN "$d"SHA256SUMS 2>/dev/null || true)
            gh release create "$v" --target "$target" --title "Caduceus for OM-3 $v" --notes-file "$d/NOTES.md" $files
            echo "published $v at $target"
          done
