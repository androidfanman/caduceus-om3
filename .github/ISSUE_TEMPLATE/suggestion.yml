name: Suggest a feature
description: An idea for the firmware, the films or LookLab.
labels: [suggestion]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Check the [roadmap](https://androidfanman.github.io/caduceus-om3/pages/roadmap/) first: it may already be planned.
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What should the camera (or LookLab) do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it would help
      description: How you would use it when shooting.
